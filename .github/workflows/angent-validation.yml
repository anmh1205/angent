name: ANGENT core validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check committed diff hygiene
        shell: bash
        run: git diff --check HEAD^ HEAD

      - name: Check manifest and core skill structure
        run: python3 scripts/validate_core.py
