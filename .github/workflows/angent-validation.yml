name: ANGENT core validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check committed diff hygiene
        shell: bash
        run: git diff --check HEAD^ HEAD

      - name: Check manifest and core skill structure
        run: python3 scripts/validate_core.py
      - name: Exercise continuity and memory runtime semantics
        run: python3 -m unittest discover -s tests -p 'test_runtime_state.py' -v

      - name: Package ChatGPT plugin from tracked core
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          import zipfile
          from pathlib import Path
          root = Path(".")
          paths = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          allowed = [
              p for p in paths
              if p in ("plugin.json", ".codex-plugin/plugin.json", "AGENTS.md")
              or p.startswith(("skills/", "assets/"))
          ]
          Path("dist").mkdir(exist_ok=True)
          with zipfile.ZipFile("dist/angent-chatgpt.zip", "w", zipfile.ZIP_DEFLATED, compresslevel=9) as bundle:
              for path in sorted(allowed):
                  bundle.write(root / path, arcname=path)
          with zipfile.ZipFile("dist/angent-chatgpt.zip") as bundle:
              assert bundle.testzip() is None
              assert len(bundle.namelist()) == len(allowed)
          PY

      - name: Upload ChatGPT plugin archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: angent-chatgpt-plugin
          path: dist/angent-chatgpt.zip
          if-no-files-found: error
          retention-days: 7
