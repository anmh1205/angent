name: ANGENT core validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check committed diff hygiene
        shell: bash
        run: git diff --check HEAD^ HEAD

      - name: Check manifest and core skill structure
        run: python3 scripts/validate_core.py
      - name: Exercise continuity and memory runtime semantics
        run: python3 -m unittest discover -s tests -p 'test_runtime_state.py' -v

      - name: Exercise authoring/report evaluation schema and comparator
        run: |
          python3 -m unittest discover -s tests -p 'test_authoring_eval.py' -v
          python3 scripts/evaluate_authoring.py
          python3 -m unittest discover -s tests -p 'test_core_eval.py' -v
          python3 scripts/evaluate_authoring.py --cases evals/core/cases.json

      - name: Exercise release identity checks
        run: |
          python3 -m unittest discover -s tests -p 'test_activation_audit.py' -v
          python3 scripts/verify_activation.py

      - name: Verify Engineer source catalog
        run: python3 extensions/angent-engineer/scripts/verify_port.py --json

      - name: Verify single-plugin bundle and selector
        run: python3 -m unittest discover -s tests -p 'test_unified_package.py' -v

      - name: Build one unified ChatGPT/Codex plugin artifact
        run: python3 scripts/package_unified.py --output dist/angent-chatgpt.zip

      - name: Upload unified ANGENT artifact (PR candidate or main)
        uses: actions/upload-artifact@v4
        with:
          name: angent-chatgpt-plugin
          path: dist/angent-chatgpt.zip
          if-no-files-found: error
          retention-days: 7
