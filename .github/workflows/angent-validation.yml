name: ANGENT core validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check committed diff hygiene
        shell: bash
        run: git diff --check HEAD^ HEAD

      - name: Check manifest and core skill structure
        run: python3 scripts/validate_core.py
      - name: Exercise continuity and memory runtime semantics
        run: python3 -m unittest discover -s tests -p 'test_runtime_state.py' -v

      - name: Exercise authoring/report evaluation schema and comparator
        run: |
          python3 -m unittest discover -s tests -p 'test_authoring_eval.py' -v
          python3 scripts/evaluate_authoring.py
          python3 -m unittest discover -s tests -p 'test_core_eval.py' -v
          python3 scripts/evaluate_authoring.py --cases evals/core/cases.json

      - name: Exercise release identity checks
        run: |
          python3 -m unittest discover -s tests -p 'test_activation_audit.py' -v
          python3 scripts/verify_activation.py

      - name: Verify Engineer source catalog
        run: python3 extensions/angent-engineer/scripts/verify_port.py --json

      - name: Verify single-plugin bundle and selector
        run: python3 -m unittest discover -s tests -p 'test_unified_package.py' -v

      - name: Verify all platform package projections
        run: python3 -m unittest discover -s tests -p 'test_multi_packages.py' -v

      - name: Verify Hub manifests, collisions and third-kit onboarding
        run: python3 -m unittest discover -s tests -p 'test_hub_registry.py' -v

      - name: Build all platform distributions
        run: python3 scripts/build_packages.py --all

      - name: Build compatible OpenAI ZIP and all-target bundle
        run: |
          python3 scripts/package_unified.py --output dist/angent-chatgpt.zip
          python3 scripts/package_all_targets.py --dist dist
          (cd dist && sha256sum angent-*.zip > SHA256SUMS)
          python3 -m unittest discover -s tests -p 'test_all_targets.py' -v

      - name: Upload platform release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angent-all-targets
          path: |
            dist/angent-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Upload unified ANGENT artifact (PR candidate or main)
        uses: actions/upload-artifact@v4
        with:
          name: angent-chatgpt-plugin
          path: dist/angent-chatgpt.zip
          if-no-files-found: error
          retention-days: 7

  ba-figma-source:
    name: BA/Figma full source regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
      - name: Run all BA, Figma and Reqwise source test modules
        run: |
          python3 -m unittest discover -s tests -p 'test_ba_*.py' -v
          python3 -m unittest discover -s tests -p 'test_figma_*.py' -v
          python3 -m unittest discover -s tests -p 'test_reqwise_*.py' -v

  ba-next-build:
    name: BA generated Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate real isolated review app from BA evidence fixture
        shell: bash
        run: |
          python3 extensions/angent-ba/scripts/build_next_prototype.py \
            extensions/angent-ba/examples/authentication-screen-model.json \
            --output "$RUNNER_TEMP/angent-ba-next-review"
      - name: Install pinned runtime packages and compile Next.js
        shell: bash
        working-directory: ${{ runner.temp }}/angent-ba-next-review
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Check build artifact and honest mock scope
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/angent-ba-next-review/.next/BUILD_ID"
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"angent-ba-next-review"/"review-manifest.json"; m=json.loads(p.read_text()); assert m["simulation_only"] is True and m["execution_status"]=="not-run"'
